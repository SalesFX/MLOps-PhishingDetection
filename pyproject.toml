[project]
name = "network-security-system-mlops-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "certifi>=2025.6.15",
    "dagshub>=0.5.10",
    "fastapi>=0.115.13",
    "httpx>=0.28.0",
    "mlflow>=3.1.0",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "pyaml>=25.5.0",
    "pymongo[srv]==3.12",
    "python-dotenv>=1.1.0",
    "python-whois>=0.9.5",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.7.0",
    "setuptools>=80.9.0",
    "uvicorn>=0.34.3",
    "diagrams>=0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "respx>=0.22.0",
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["network_security*"]
